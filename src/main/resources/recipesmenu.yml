# ============================================================
# AL-RecipeViewer 新增配方菜单配置
#
# 配置版本 config_version: 2 —— 插件启动时自动升级旧版本配置：
#   只补缺失的新键（连同注释），自定义过的键一律保留原样，旧文件备份为 recipesmenu.yml.bak
#
# 文字使用 {@key} 引用 lang 文件中的 menu 节点
#
# 按钮配置项与 triggers 动作写法同 menu.yml（见其头部说明）。
# 本文件创建器用到的业务动作:
#   open_creator: 类型        - 打开指定类型创建器（shaped/shapeless/furnace/smithing/
#                               stonecutting/campfire/smoking/brewing）
#   creator_adjust: 槽位      - 调整数值，左键 + / 右键 -（P=烧炼时间, G=高炉/营火时间,
#                               Y=烟熏时间, E=经验）
#   creator_mode              - 切换烧炼模式（左键=高炉 / 右键=熔炉 / Shift+左键=两者）
#   creator_exp_input         - 聊天栏手动输入经验值
#   save_recipe               - 保存当前配方
#   back                      - 返回配方列表
# ============================================================

# 配置版本（插件自动维护，请勿手动调小）
config_version: 2

# ===== 配方创建器 — 类型选择 =====
recipe_creator_type:
  title: "{@creator_type_title}"
  size: 54
  shape:
    - "#########"
    - "#A#C#F#S#"
    - "#L#Y#T#N#"
    - "####B####"
  buttons:
    # 有序合成（工作台 3×3）
    A:
      material: "CRAFTING_TABLE"
      name: "{@creator_shaped}"
      lore:
        - "{@creator_shaped_desc}"
      triggers:
        left:
          - "open_creator: shaped"
    # 无序合成
    C:
      material: "CRAFTING_TABLE"
      name: "{@creator_shapeless}"
      lore:
        - "{@creator_shapeless_desc}"
      triggers:
        left:
          - "open_creator: shapeless"
    # 熔炉 / 高炉
    F:
      material: "FURNACE"
      name: "{@creator_furnace}"
      lore:
        - "{@creator_furnace_desc}"
      triggers:
        left:
          - "open_creator: furnace"
    # 锻造台
    S:
      material: "SMITHING_TABLE"
      name: "{@creator_smithing}"
      lore:
        - "{@creator_smithing_desc}"
      triggers:
        left:
          - "open_creator: smithing"
    # 切石机
    T:
      material: "STONECUTTER"
      name: "{@creator_stonecutter}"
      lore:
        - "{@creator_stonecutter_desc}"
      triggers:
        left:
          - "open_creator: stonecutting"
    # 酿造台
    N:
      material: "BREWING_STAND"
      name: "{@creator_brewing}"
      lore:
        - "{@creator_brewing_desc}"
      triggers:
        left:
          - "open_creator: brewing"
    # 营火
    L:
      material: "CAMPFIRE"
      name: "{@creator_campfire}"
      lore:
        - "{@creator_campfire_desc}"
      triggers:
        left:
          - "open_creator: campfire"
    # 烟熏炉
    Y:
      material: "SMOKER"
      name: "{@creator_smoking}"
      lore:
        - "{@creator_smoking_desc}"
      triggers:
        left:
          - "open_creator: smoking"
    # 返回
    B:
      material: "OAK_DOOR"
      name: "{@creator_back}"
      triggers:
        left:
          - "back"
    # 背景填充
    "#":
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

# ===== 配方创建器 — 有序合成 =====
recipe_creator_shaped:
  title: "{@creator_shaped_title}"
  size: 54
  shape:
    - "#########"
    - "#III#####"
    - "#III###R#"
    - "#III#####"
    - "#########"
    - "####B####"
  buttons:
    # 原料区 — 3×3 配方格（从背包拖入物品）
    I:
      dynamic: true
    # 结果物品 — 从背包拖入
    R:
      dynamic: true
    # 保存配方
    B:
      material: "OAK_DOOR"
      name: "{@creator_save}"
      triggers:
        left:
          - "save_recipe"
    # 背景填充
    "#":
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

