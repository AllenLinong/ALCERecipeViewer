# ===== 配方创建器 — 熔炉 / 高炉 =====
recipe_creator_furnace:
  title: "{@creator_furnace_title}"
  size: 54
  shape:
    - "#########"
    - "####S####"
    - "##I###R##"
    - "##P###E##"
    - "#########"
    - "####B####"
  buttons:
    # 烧炼原料 — 从背包拖入
    I:
      dynamic: true
    # 烧炼结果 — 从背包拖入
    R:
      dynamic: true
    # 切换模式：左键=高炉 / 右键=熔炉 / Shift+左键=两者
    S:
      material: "GREEN_STAINED_GLASS_PANE"
      name: "{@furnace_mode}"
      lore:
        - "{@furnace_mode_left}"
        - "{@furnace_mode_right}"
        - "{@furnace_mode_shift}"
      action: "CREATOR_FURNACE_MODE"
    # 烧炼时间 — 左键 +1 / 右键 -1（ticks，20 ticks = 1 秒）
    P:
      material: "CLOCK"
      name: "{@furnace_time}"
      lore:
        - "{@furnace_time_lore}"
        - "{@furnace_time_mode}"
        - "{@furnace_time_hint}"
      action: "CREATOR_FURNACE_TIME"
    # 经验值 — 左键 +0.1 / 右键 -0.1 / Shift+左键 手动输入
    E:
      material: "EXPERIENCE_BOTTLE"
      name: "{@furnace_exp}"
      lore:
        - "{@furnace_exp_lore}"
        - "{@furnace_exp_shift}"
      action: "CREATOR_EXP"
    # 保存配方
    B:
      material: "OAK_DOOR"
      name: "{@creator_save}"
      action: "SAVE_RECIPE"
    # 背景填充
    "#":
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

