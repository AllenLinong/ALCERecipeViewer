# ============================================================
# AL-RecipeViewer 菜单配置文件 (Shape 布局)
#
# 配置版本 config_version: 3 —— 插件启动时自动升级旧版本配置：
#   只补缺失的新键（连同注释），自定义过的键一律保留原样，旧文件备份为 menu.yml.bak
#   v3 新增：排序管理菜单 order_list（/alcerecipes admin order）
#
# 文字使用 {@key} 引用 lang 文件中的 menu 节点
#
# 主菜单 {count} 变量 = 该分类未隐藏的配方数（与普通玩家实际能浏览的数量一致），
# 管理端主菜单额外显示隐藏数。
# 按钮配置项:
#   material: 原版 Material 枚举值（如 CRAFTING_TABLE）或 CE 自定义物品 ID（如 namespace:item_id）
#   name: 按钮显示名称，支持 {@key} 语言引用
#   lore: 按钮说明文字列表
#   category: 分类 ID（主菜单分类按钮需要，用于统计配方数量）
#   sound: 点击音效，支持原版声音（block.note_block.pling）或 CE 自定义声音（namespace:sound_id）
#          可写 "名称-音量-音调"，不填默认使用 config.yml 的 default-button-sound
#
# ---- triggers 动作（参照 ALFriends）----
# 按钮行为统一写 triggers 列表，按点击类型分发，按顺序执行:
#   triggers:
#     left:        [ "动作串", ... ]
#     right:       [ ... ]
#     shift_left:  [ ... ]
#     shift_right: [ ... ]
#
# 动作串格式 "类型: 参数"，可用的通用动作:
#   close                    - 关闭菜单（关闭后，后续动作默认延迟 1 tick 再执行，
#                             即关菜单再开菜单的安全间隔；显式 delay: 在此基础上累加，
#                             如 close + delay: 5 = 后续动作 6 tick 后执行）
#   sound: 名称-音量-音调     - 播放音效（写了它则不再播按钮默认音）
#   command: 命令            - 玩家身份执行（cmd:/player:/execute: 同义）
#   op: 命令                 - 临时 OP 身份执行，结束后恢复
#   console: 命令            - 控制台身份执行
#   message: 文本            - 给玩家发消息（支持 & 颜色码）
#   open: main|admin_main|order_main|creator_type - 打开指定菜单
#   delay: 20                - 延迟后续动作，支持 20、20t、1s、500ms（wait 同义）
# 命令类动作用英文分号分隔多条，开头的 / 可写可不写
# 占位符: {player}/%player_name%、{uuid}/%player_uuid%、{world}/%world%
#
# 本插件的业务动作:
#   open_category: 分类ID    - 打开分类配方列表（在排序主菜单中则打开排序列表）
#   prev_page / next_page    - 翻页
#   search / search_mode / search_clear - 搜索 / 切换搜索模式 / 清空搜索
#   back                     - 返回上一级（详情→列表、创建器→列表、排序列表→排序主菜单）
#   back_to_main             - 返回主菜单（排序列表中返回排序主菜单）
#   create_recipe            - 打开配方创建器（需 alcerecipeviewer.admin 权限）
#   prev_recipe / next_recipe - 多配方轮播手动切换
#   open_creator: 类型       - 打开指定类型创建器（shaped/shapeless/furnace/smithing/
#                              stonecutting/campfire/smoking/brewing）
#   creator_adjust: 槽位     - 调整创建器数值（左键+ / 右键-，槽位 P/G/Y/E）
#   creator_mode             - 切换熔炉/高炉烧炼模式
#   creator_exp_input        - 聊天栏输入经验值
#   save_recipe              - 保存当前创建器配方
#
# 兼容说明: 旧版单值 action:（OPEN_CATEGORY/PREV_PAGE/...）仍可读取，
# 但同时配置 action 和 triggers 时以 triggers 为准，新配置一律用 triggers。
# ============================================================

# 配置版本（插件自动维护，请勿手动调小）
config_version: 3

# ===== 主菜单 =====
main_menu:
  title: "{@main_title}"
  shape:
    - "#########"
    - "#A#B#C#D#"
    - "#########"
    - "#E#F#G#H#"
    - "#########"
    - "#########"
  buttons:
    # ---- 8 个分类入口 ----
    # 工作台配方
    A:
      material: "CRAFTING_TABLE"
      name: "{@category_crafting}"
      lore:
        - "{@category_crafting_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      triggers:
        left:
          - "open_category: crafting"
      category: "crafting"
    # 熔炉配方
    B:
      material: "FURNACE"
      name: "{@category_smelting}"
      lore:
        - "{@category_smelting_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      triggers:
        left:
          - "open_category: smelting"
      category: "smelting"
    # 高炉配方
    C:
      material: "BLAST_FURNACE"
      name: "{@category_blasting}"
      lore:
        - "{@category_blasting_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      triggers:
        left:
          - "open_category: blasting"
      category: "blasting"
    # 烟熏炉配方
    D:
      material: "SMOKER"
      name: "{@category_smoking}"
      lore:
        - "{@category_smoking_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      triggers:
        left:
          - "open_category: smoking"
      category: "smoking"
    # 营火配方
    E:
      material: "CAMPFIRE"
      name: "{@category_campfire}"
      lore:
        - "{@category_campfire_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      triggers:
        left:
          - "open_category: campfire_cooking"
      category: "campfire_cooking"
    # 切石机配方
    F:
      material: "STONECUTTER"
      name: "{@category_stonecutting}"
      lore:
        - "{@category_stonecutting_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      triggers:
        left:
          - "open_category: stonecutting"
      category: "stonecutting"
    # 锻造台配方
    G:
      material: "SMITHING_TABLE"
      name: "{@category_smithing}"
      lore:
        - "{@category_smithing_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      triggers:
        left:
          - "open_category: smithing"
      category: "smithing"
    # 酿造台配方
    H:
      material: "BREWING_STAND"
      name: "{@category_brewing}"
      lore:
        - "{@category_brewing_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      triggers:
        left:
          - "open_category: brewing"
      category: "brewing"
    # ---- 背景填充 ----
    "#":
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

    # ---- 自定义按钮示例（取消注释并将 Z 加入 shape 即可启用）----
    #Z:
    #  material: "BOOK"
    #  name: "&6Wiki"
    #  lore:
    #    - "&7左键打开 Wiki"
    #    - "&7右键回主城并提示"
    #    - "&7Shift+左键发消息给全体"
    #  triggers:
    #    left:
    #      - "sound: block.note_block.pling"
    #      - "command: wiki open"
    #      - "delay: 10"
    #      - "console: tell {player} Wiki 命令已执行"
    #    right:
    #      - "message: &a正在返回主城..."
    #      - "delay: 0.5s"
    #      - "op: spawn"
    #    shift_left:
    #      - "console: say {player} 点击了自定义菜单按钮; give {player} paper 1"
    #  sound: "block.note_block.pling"

# ===== 配方列表（分类浏览）=====
recipe_list:
  title: "&8{category} ({page}/{total})"
  shape:
    - "#########"
    - "#IIIIIII#"
    - "#IIIIIII#"
    - "#IIIIIII#"
    - "#IIIIIII#"
    - "P#S#B###N"
  buttons:
    # 动态物品区 — 显示当前页的配方图标
    I:
      dynamic: true
    # 上一页
    P:
      material: "ARROW"
      name: "{@prev_page}"
      lore:
        - "{@page_indicator}"
      triggers:
        left:
          - "prev_page"
    # 搜索按钮（左键搜索 / 右键切换模式 / Shift+左键清空）
    S:
      material: "COMPASS"
      name: "{@search}"
      lore:
        - "{mode_line}"
        - "{@search_current}"
        - "{@search_left}"
        - "{@search_right}"
        - "{@search_shift}"
      triggers:
        left:
          - "search"
        right:
          - "search_mode"
        shift_left:
          - "search_clear"
    # 返回主菜单
    B:
      material: "OAK_DOOR"
      name: "{@back_to_main}"
      lore:
        - "{@back_to_main_desc}"
      triggers:
        left:
          - "back_to_main"
    # 下一页
    N:
      material: "ARROW"
      name: "{@next_page}"
      lore:
        - "{@page_indicator}"
      triggers:
        left:
          - "next_page"
    # 关闭菜单
    C:
      material: "BARRIER"
      name: "{@close}"
      triggers:
        left:
          - "close"
    # 背景填充
    "#":
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

# ===== 排序管理列表（管理员，/alcerecipes admin order）=====
# 内容与普通玩家看到的列表完全一致（已隐藏的配方不显示）。
# 左键点击配方物品 = 上移一位，右键 = 下移一位，调整即时保存到 recipe_order.yml。
# 排序主菜单复用 main_menu 布局（标题不同），分类按钮点击进入本列表。
order_list:
  title: "{@order_list_title}"
  shape:
    - "#########"
    - "#IIIIIII#"
    - "#IIIIIII#"
    - "#IIIIIII#"
    - "#IIIIIII#"
    - "P#H#B###N"
  buttons:
    # 动态物品区 — 显示当前页的配方图标（玩家视角顺序）
    I:
      dynamic: true
    # 上一页
    P:
      material: "ARROW"
      name: "{@prev_page}"
      lore:
        - "{@page_indicator}"
      triggers:
        left:
          - "prev_page"
    # 操作说明（纯展示，无动作）
    H:
      material: "COMPARATOR"
      name: "{@order_hint_title}"
      lore:
        - "{@order_hint_1}"
        - "{@order_hint_2}"
        - "{@order_hint_3}"
        - "{@order_hint_4}"
        - "{@order_hint_5}"
        - "{@order_hint_share}"
    # 返回排序分类选择
    B:
      material: "OAK_DOOR"
      name: "{@back_to_main}"
      lore:
        - "{@order_hint_back}"
      triggers:
        left:
          - "back_to_main"
    # 下一页
    N:
      material: "ARROW"
      name: "{@next_page}"
      lore:
        - "{@page_indicator}"
      triggers:
        left:
          - "next_page"
    # 背景填充
    "#":
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

