# ============================================================
# AL-RecipeViewer 菜单配置文件 (Shape 布局)
# 文字使用 {@key} 引用 lang 文件中的 menu 节点
#
# 按钮配置项:
#   material: 原版 Material 枚举值（如 CRAFTING_TABLE）或 CE 自定义物品 ID（如 namespace:item_id）
#   name: 按钮显示名称，支持 {@key} 语言引用
#   lore: 按钮说明文字列表
#   action: 点击行为
#     OPEN_CATEGORY  - 打开某个分类的配方列表（需配置 category）
#     PREV_PAGE      - 翻到上一页
#     NEXT_PAGE      - 翻到下一页
#     PREV_RECIPE    - 切换到上一个配方（多配方轮播）
#     NEXT_RECIPE    - 切换到下一个配方（多配方轮播）
#     BACK           - 返回上一级菜单
#     BACK_TO_MAIN   - 返回主菜单
#     CLOSE          - 关闭菜单
#     SEARCH         - 搜索配方
#     RUN_COMMAND    - 执行自定义命令（需配置 command）
#   category: 分类 ID（action=OPEN_CATEGORY 时需要）
#   command: 自定义命令（action=RUN_COMMAND 时生效，不带 /）
#   as_player: true=以玩家身份执行，false=控制台（{player}=玩家名）
#   triggers: 自定义点击动作，支持 left/right/shift_left/shift_right
#     command: 命令  - 玩家身份执行
#     op: 命令       - 临时 OP 身份执行，执行后恢复原权限
#     console: 命令  - 控制台身份执行
#     delay: 20      - 延迟后续动作，支持 20、20t、1s、500ms（wait 同义）
#   同一动作可用英文分号分隔多条命令；命令开头的 / 可写可不写
#   占位符: {player}/%player_name%、{uuid}/%player_uuid%、{world}/%world%
#   sound: 点击音效，支持原版声音（如 block.note_block.pling）或 CE 自定义声音（如 namespace:sound_id）
#          不填默认使用 block.note_block.pling
# ============================================================

# ===== 主菜单 =====
main_menu:
  title: "{@main_title}"
  shape:
    - "#########"
    - "#A#B#C#D#"
    - "#########"
    - "#E#F#G#H#"
    - "#########"
    - "#########"
  buttons:
    # ---- 8 个分类入口 ----
    # 工作台配方
    A:
      material: "CRAFTING_TABLE"
      name: "{@category_crafting}"
      lore:
        - "{@category_crafting_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      action: "OPEN_CATEGORY"
      category: "crafting"
    # 熔炉配方
    B:
      material: "FURNACE"
      name: "{@category_smelting}"
      lore:
        - "{@category_smelting_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      action: "OPEN_CATEGORY"
      category: "smelting"
    # 高炉配方
    C:
      material: "BLAST_FURNACE"
      name: "{@category_blasting}"
      lore:
        - "{@category_blasting_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      action: "OPEN_CATEGORY"
      category: "blasting"
    # 烟熏炉配方
    D:
      material: "SMOKER"
      name: "{@category_smoking}"
      lore:
        - "{@category_smoking_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      action: "OPEN_CATEGORY"
      category: "smoking"
    # 营火配方
    E:
      material: "CAMPFIRE"
      name: "{@category_campfire}"
      lore:
        - "{@category_campfire_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      action: "OPEN_CATEGORY"
      category: "campfire_cooking"
    # 切石机配方
    F:
      material: "STONECUTTER"
      name: "{@category_stonecutting}"
      lore:
        - "{@category_stonecutting_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      action: "OPEN_CATEGORY"
      category: "stonecutting"
    # 锻造台配方
    G:
      material: "SMITHING_TABLE"
      name: "{@category_smithing}"
      lore:
        - "{@category_smithing_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      action: "OPEN_CATEGORY"
      category: "smithing"
    # 酿造台配方
    H:
      material: "BREWING_STAND"
      name: "{@category_brewing}"
      lore:
        - "{@category_brewing_desc}"
        - "{@recipe_count}"
        - ""
        - "{@click_browse}"
      action: "OPEN_CATEGORY"
      category: "brewing"
    # ---- 背景填充 ----
    "#":
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

    # ---- 自定义命令按钮示例（取消注释并将 Z 加入 shape 即可启用）----
    #Z:
    #  material: "BOOK"
    #  name: "&6Wiki"
    #  lore:
    #    - "&7左键打开 Wiki"
    #    - "&7右键返回主城"
    #  triggers:
    #    left:
    #      - "command: wiki open"
    #      - "delay: 10"
    #      - "console: tell {player} Wiki 命令已执行"
    #    right:
    #      - "op: spawn"
    #    shift_left:
    #      - "console: say {player} 点击了自定义菜单按钮; give {player} paper 1"
    #  sound: "block.note_block.pling"

# ===== 配方列表（分类浏览）=====
recipe_list:
  title: "&8{category} ({page}/{total})"
  shape:
    - "#########"
    - "#IIIIIII#"
    - "#IIIIIII#"
    - "#IIIIIII#"
    - "#IIIIIII#"
    - "P#S#B###N"
  buttons:
    # 动态物品区 — 显示当前页的配方图标
    I:
      dynamic: true
    # 上一页
    P:
      material: "ARROW"
      name: "{@prev_page}"
      lore:
        - "{@page_indicator}"
      action: "PREV_PAGE"
    # 搜索按钮（左键搜索 / 右键切换模式 / Shift+左键清空）
    S:
      material: "COMPASS"
      name: "{@search}"
      lore:
        - "{mode_line}"
        - "{@search_current}"
        - "{@search_left}"
        - "{@search_right}"
        - "{@search_shift}"
      action: "SEARCH"
    # 返回主菜单
    B:
      material: "OAK_DOOR"
      name: "{@back_to_main}"
      lore:
        - "{@back_to_main_desc}"
      action: "BACK_TO_MAIN"
    # 下一页
    N:
      material: "ARROW"
      name: "{@next_page}"
      lore:
        - "{@page_indicator}"
      action: "NEXT_PAGE"
    # 关闭菜单
    C:
      material: "BARRIER"
      name: "{@close}"
      action: "CLOSE"
    # 背景填充
    "#":
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

# ===== 配方详情 — 工作台 =====
detail_crafting:
  title: "{@detail_crafting_title}"
  size: 54
  shape:
    - "#########"
    - "#III#####"
    - "#III##R##"
    - "#III#####"
    - "#########"
    - "L###B###N"
  buttons:
    # 原料 — 3×3 配方格
    I:
      dynamic: true
    # 结果物品
    R:
      dynamic: true
    # 上一个配方（同物品其他合成方式）
    L:
      material: "ARROW"
      name: "{@prev_recipe}"
      action: "PREV_RECIPE"
    # 下一个配方
    N:
      material: "ARROW"
      name: "{@next_recipe}"
      action: "NEXT_RECIPE"
    # 返回配方列表
    B:
      material: "OAK_DOOR"
      name: "{@back}"
      action: "BACK"
    # 背景填充
    "#":
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

