# 聊天消息前缀
plugin-prefix: "&8[&6ALCE合成表&8]&r"

# 配方类型显示名称（用于配方列表物品的 lore）
recipe-types:
  crafting: "工作台"
  shaped: "有序合成"
  shapeless: "无序合成"
  smelting: "熔炉烧炼"
  blasting: "高炉烧炼"
  smoking: "烟熏炉"
  campfire_cooking: "营火烹饪"
  stonecutting: "切石机"
  smithing: "锻造台"
  smithing_transform: "锻造台"
  smithing_trim: "锻造纹饰"
  brewing: "酿造台"

# CE 物品的自定义中文名（用于排序和搜索，不覆盖客户端 item_name 显示）
custom-names: {}

# 配方列表底部栏的固定文字
recipe-lore:
  result: "&7产出: &f{count}个"
  type: "&7类型: &f{type}"
  click: "&e▶ 点击查看合成表"
  multi-recipes: "&d◆ 共{count}种合成方式"
  cycle-indicator: "&7配方 {current}/{total} &8| &7{interval}秒后切换"

# 分类默认显示名称
# 用于配方列表标题，若 lang.yml 未配置则回退到 CEBridge 内置名称
default-categories:
  crafting: "工作台配方"
  smelting: "熔炉烧炼"
  blasting: "高炉烧炼"
  smoking: "烟熏炉"
  campfire_cooking: "营火烹饪"
  stonecutting: "切石机"
  smithing: "锻造台"
  brewing: "酿造台"

# 搜索结果追加到标题的后缀
search-title-suffix: " | \"{query}\""

